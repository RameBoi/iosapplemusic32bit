name: Build MusicClone IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      sdk:
        description: 'Force one SDK folder from theos/sdks, e.g. iPhoneOS10.3.sdk (leave empty = try 9.3, 10.3, 11.4)'
        required: false
        default: ''

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Pick Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_1[4-6]*.app 2>/dev/null | sort -V | head -1 || true)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          MAJOR=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          if [ "$MAJOR" -ge 15 ]; then echo "LD_CLASSIC=1" >> "$GITHUB_ENV"; fi

      - name: Install Theos and tools
        run: |
          brew install ldid dpkg
          git clone --recursive --depth=1 --shallow-submodules https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Get old iOS SDKs
        run: |
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          LIST=$(git ls-tree --name-only HEAD | grep '^iPhoneOS' | sort -V)
          echo "Available SDKs:"; echo "$LIST"
          PICKS="${{ github.event.inputs.sdk }}"
          if [ -z "$PICKS" ]; then
            PICKS=$(echo "$LIST" | grep -E '^iPhoneOS(9\.3|10\.3|11\.4)\.sdk$' | tr '\n' ' ')
          fi
          echo "Will try: $PICKS"
          git sparse-checkout set $PICKS
          mkdir -p "$THEOS/sdks"
          for P in $PICKS; do cp -R "$P" "$THEOS/sdks/"; done

      - name: Build (tries each SDK until one links)
        run: |
          OK=0
          for P in $(ls "$THEOS/sdks" | grep '^iPhoneOS' | sort -V); do
            VER="${P#iPhoneOS}"; VER="${VER%.sdk}"
            echo "=============== Trying SDK $VER ==============="

            STUB="$THEOS/sdks/$P/usr/lib/system/liblaunch.tbd"
            if [ ! -f "$STUB" ]; then
              mkdir -p "$(dirname "$STUB")"
              printf '%s\n' \
                '--- !tapi-tbd-v2' \
                'archs:           [ armv7, armv7s, arm64 ]' \
                'platform:        ios' \
                'install-name:    /usr/lib/system/liblaunch.dylib' \
                'current-version: 1' \
                'compatibility-version: 1' \
                'exports:' \
                '  - archs:           [ armv7, armv7s, arm64 ]' \
                '    symbols:         [ ]' \
                '...' > "$STUB"
              echo "Added liblaunch stub for $P"
            fi

            make clean >/dev/null 2>&1 || true
            if make package FINALPACKAGE=1 MC_SDK="$VER"; then
              echo "BUILD OK with SDK $VER"
              OK=1
              break
            fi
            echo "SDK $VER failed, trying next"
          done
          [ "$OK" = 1 ]

      - name: Make IPA and DEB
        run: |
          test -f Resources/Info.plist || { echo "ERROR: Resources/Info.plist is missing from the repo"; exit 1; }
          APP=$(find .theos/_ -maxdepth 3 -name 'MusicClone.app' | head -1 || true)
          test -n "$APP"
          cp -R Resources/. "$APP/"
          test -f "$APP/Info.plist"
          echo "App bundle: $APP"
          ls -la "$APP"
          lipo -info "$APP/MusicClone"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qr MusicClone.ipa Payload && rm -rf Payload)
          dpkg-deb -Zgzip -b .theos/_ dist/com.rameboi.musicclone_1.0.0_iphoneos-arm.deb
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: MusicClone
          path: dist/*
